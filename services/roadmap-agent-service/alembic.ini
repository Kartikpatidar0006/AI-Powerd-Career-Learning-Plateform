# Alembic configuration file for roadmap-agent-service

[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy URL — overridden at runtime via env.py
sqlalchemy.url = postgresql+asyncpg://roadmap_user:roadmap_pass@postgres-roadmap:5432/roadmap_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
